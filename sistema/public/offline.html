<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff0a41">
    <title>Sin conexión | FARM SJB</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f5f5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #323232; padding: 16px; }
        .card { background: #fff; max-width: 420px; width: 100%; padding: 40px 32px; border-radius: 16px; border-top: 5px solid #ff0a41; box-shadow: 0 4px 16px rgba(0, 0, 0, .08); text-align: center; }
        .icon { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%; background: #ff0a41; display: flex; align-items: center; justify-content: center; }
        h1 { font-size: 1.35rem; margin: 0 0 8px; }
        p { color: #6c757d; margin: 0 0 24px; line-height: 1.5; }
        button { background: #ff0a41; color: #fff; border: 0; border-radius: 8px; padding: 10px 24px; font-size: 1rem; cursor: pointer; }
        button:hover { opacity: .9; }
        small { display: block; margin-top: 24px; color: #adb5bd; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
        <h1>Sin conexión</h1>
        <p>No se pudo conectar con el sistema. Revisa tu conexión a internet o a la red de la farmacia e inténtalo de nuevo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
        <small>FARM SJB · Sistema de Venta de Medicamentos</small>
    </div>
</body>
</html>
